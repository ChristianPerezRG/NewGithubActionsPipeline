# Flyway Desktop project. Committed.
#
# Source of truth is schema-model/. Developers make changes in their development
# database, save them to the schema model in Flyway Desktop, generate a versioned
# (+ undo) migration from the model, and push both. The pipelines then run the
# migrations. Local-only JDBC URLs and credentials belong in flyway.user.toml
# (gitignored) - see setup/README.md for the template.
#
# The pipelines pass connection details in as action inputs (target-url, target-user,
# target-password), which override anything set here. The environments below exist so
# the workflows have something to name and so Flyway Desktop can use the same project.

name = "NewGithubActionsPipeline"
databaseType = "SqlServer"

[flywayDesktop]
developmentEnvironment = "development"
shadowEnvironment = "shadow"
schemaModel = "schema-model"

[redgateCompare]
filterFile = "Filter.scpf"

# QA and Production jobs don't set target-environment, so the actions fall back to
# 'default'. The URL is supplied by the workflow at run time.
[environments.default]

# Referenced by deploy-build.yml as target-environment: build.
# provisioner = "clean" is REQUIRED — the Migrate Build step uses
# provision-mode: reprovision, which runs this provisioner to wipe the Build
# database before rebuilding it. Without it, that step won't clean anything.
[environments.build]
provisioner = "clean"

# Referenced by deploy-build.yml and deploy-prod.yml as build-environment: check.
# The throwaway database the check reports build the comparison against. Those
# steps pass build-ok-to-erase: true, so Flyway is allowed to wipe it each run.
[environments.check]

# Local development environments — URLs live in flyway.user.toml.
[environments.development]

[environments.shadow]
provisioner = "clean"

[flyway]
locations = ["filesystem:migrations"]
schemaModelLocation = "schema-model"

# Migrations can land out of sequence when feature branches merge independently.
outOfOrder = true

# Allow DDL and DML in one script.
mixed = true

# Baseline an already-populated database on first run rather than failing.
baselineOnMigrate = true

# QA, Prod1 and Prod2 already contain the Northwind schema captured in the schema model
# and in B001, so on first deployment they must baseline AT version 001 — otherwise
# Flyway treats B001 as pending and fails trying to create objects that already exist.
#
# Flyway reads '_' in a filename as a version separator, so
# B001_20260925101351__baseline.sql has version 001.20260925101351.
# This must match exactly. Update it if the baseline is ever regenerated.
#
# B001 is a Flyway *baseline migration* (B prefix, generated by Flyway Desktop's
# "generate baseline"). Flyway runs it only when building an empty database (Build,
# Check, Shadow) and skips it on databases baselined at this version (QA, Prod).
baselineVersion = "001.20260925101351"

# Reject anything that doesn't match {V,U,B}{version}_{timestamp}__{description}.sql
validateMigrationNaming = true

# Safety lock. deploy-build.yml overrides this for the Build environment only, via
# -environments.build.flyway.cleanDisabled=false, and the checks action overrides it
# for the check environment because of build-ok-to-erase: true.
cleanDisabled = true
