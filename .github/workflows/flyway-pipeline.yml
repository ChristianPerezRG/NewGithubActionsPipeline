# One pipeline, five chained stages, triggered by pushing a migration script:
#
#   Build Database -> QA Check Report -> Deploy QA -> Production Check Report -> [approval] -> Deploy Prod
#
# Consolidation of Flyway-Sample-Pipelines/Azure/Simple-Workflow (deploy-build, deploy-qa,
# deploy-prod) into a single GitHub Actions workflow. Same Flyway CLI commands, same variables.
# The approval is the 'production' GitHub Environment with a required reviewer.

name: Flyway Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
  workflow_dispatch:

env:
  # Repository Variables - Settings > Secrets and variables > Actions > Variables
  BASELINE_VERSION: ${{ vars.BASELINE_VERSION }} # version of the B001 baseline migration
  JDBC_BUILD: ${{ vars.JDBC_BUILD }}
  JDBC_QA: ${{ vars.JDBC_QA }}
  JDBC_PROD1: ${{ vars.JDBC_PROD1 }}
  JDBC_CHECK: ${{ vars.JDBC_CHECK }} # throwaway DB the check reports build against - wiped every run
  EMAIL: ${{ vars.USER_EMAIL }}

  # Repository Secrets - Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }}
  FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }} # first version that has an undo script (undo -target is inclusive)
  DB_USER_BUILD: ${{ secrets.DB_USER_BUILD }}
  DB_USER_PW_BUILD: ${{ secrets.DB_USER_PW_BUILD }}
  DB_USER_QA: ${{ secrets.DB_USER_QA }}
  DB_USER_PW_QA: ${{ secrets.DB_USER_PW_QA }}
  DB_USER_PROD1: ${{ secrets.DB_USER_PROD1 }}
  DB_USER_PW_PROD1: ${{ secrets.DB_USER_PW_PROD1 }}
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}

  # Same as the Azure $(FLYWAY) variable: common arguments for every flyway call.
  FLYWAY: >-
    flyway -email="${{ vars.USER_EMAIL }}" -token="${{ secrets.FLYWAY_TOKEN }}"
    -locations="filesystem:${{ github.workspace }}\migrations"
    -configFiles="${{ github.workspace }}\flyway.toml"
    -baselineOnMigrate=true -baselineVersion=${{ vars.BASELINE_VERSION }}
    -errorOverrides=S0001:0:I-

  # Blank these out to use Windows integrated security instead (see setup/README.md)
  BUILD_LOGIN: -user="${{ secrets.DB_USER_BUILD }}" -password="${{ secrets.DB_USER_PW_BUILD }}"
  QA_LOGIN: -user="${{ secrets.DB_USER_QA }}" -password="${{ secrets.DB_USER_PW_QA }}"
  PROD_LOGIN: -user="${{ secrets.DB_USER_PROD1 }}" -password="${{ secrets.DB_USER_PW_PROD1 }}"
  CHECK_LOGIN: -environments.check.user="${{ secrets.DB_USER_CHECK }}" -environments.check.password="${{ secrets.DB_USER_PW_CHECK }}"

jobs:
  # ================================================================ 1. Build
  # Reset the Build DB to empty, replay every migration, then roll back through every
  # undo script. Fails if any V or U script is broken.
  build:
    name: Build Database
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      # Installs and licenses Flyway on the runner (pinned for reproducible runs).
      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Clean Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} info clean info -url="${{ env.JDBC_BUILD }}"
        env:
          FLYWAY_CLEAN_DISABLED: false

      - name: Migrate Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} migrate info -url="${{ env.JDBC_BUILD }}"

      - name: Rollback Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} undo info -url="${{ env.JDBC_BUILD }}" -target="${{ env.FIRST_UNDO_SCRIPT }}"

  # ======================================================== 2. QA Check Report
  # Code analysis, change report, drift check and dry-run SQL for QA, before anything
  # is deployed there.
  qa-report:
    name: QA Check Report
    runs-on: self-hosted
    needs: build
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: QA Check Report
        run: >-
          ${{ env.FLYWAY }} ${{ env.QA_LOGIN }} ${{ env.CHECK_LOGIN }}
          check -code -changes -drift -dryrun -url="${{ env.JDBC_QA }}"
          -environments.check.url="${{ env.JDBC_CHECK }}"
          -environments.check.flyway.cleanDisabled=false
          -check.buildEnvironment="check"
          -reportFilename="${{ github.workspace }}\reports\QA-${{ github.run_id }}-Check-Report.html"
        env:
          FLYWAY_CLEAN_DISABLED: true
          FLYWAY_ENV_NATIVE_SQLFLUFF: true

      - name: Publish QA Check Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn

  # =============================================================== 3. Deploy QA
  deploy-qa:
    name: Deploy QA
    runs-on: self-hosted
    needs: qa-report
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Deploy QA
        run: ${{ env.FLYWAY }} ${{ env.QA_LOGIN }} info migrate info -url="${{ env.JDBC_QA }}"
        env:
          FLYWAY_CLEAN_DISABLED: true

  # ================================================ 4. Production Check Report
  # Fresh report against Production for the approver. Nothing is deployed here.
  prod-report:
    name: Production Check Report
    runs-on: self-hosted
    needs: deploy-qa
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Production Check Report
        run: >-
          ${{ env.FLYWAY }} ${{ env.PROD_LOGIN }} ${{ env.CHECK_LOGIN }}
          check -code -changes -drift -dryrun -url="${{ env.JDBC_PROD1 }}"
          -environments.check.url="${{ env.JDBC_CHECK }}"
          -environments.check.flyway.cleanDisabled=false
          -check.buildEnvironment="check"
          -reportFilename="${{ github.workspace }}\reports\Prod-${{ github.run_id }}-Check-Report.html"
        env:
          FLYWAY_CLEAN_DISABLED: true
          FLYWAY_ENV_NATIVE_SQLFLUFF: true

      - name: Publish Production Check Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: prod-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn

  # ================================================ 5. Approval -> Deploy Prod
  # 'environment: production' holds this job until a required reviewer approves it in
  # the run UI (Settings > Environments > production). Review the prod-check-report
  # artifact first.
  deploy-prod:
    name: Deploy Prod
    runs-on: self-hosted
    needs: prod-report
    environment: production
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Deploy Prod
        run: ${{ env.FLYWAY }} ${{ env.PROD_LOGIN }} info migrate info -url="${{ env.JDBC_PROD1 }}"
        env:
          FLYWAY_CLEAN_DISABLED: true
