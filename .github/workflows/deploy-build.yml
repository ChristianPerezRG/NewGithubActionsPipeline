# Clean -> Migrate -> Rollback the Build DB, then report on QA, then hand off to
# deploy-qa.yml and deploy-prod.yml so the whole pipeline shows as ONE run.
#
# GitHub Actions port of Flyway-Sample-Pipelines/Azure/Simple-Workflow/deploy-build.yml.
# Azure stages become jobs; Azure variable groups become repo Variables/Secrets;
# PublishBuildArtifacts becomes actions/upload-artifact. Flyway commands are identical.
#
# Trigger: a push to main that touches migrations/** (a generated migration script).

name: Flyway Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
  workflow_dispatch: # Azure pipelines can always be queued manually; this is the equivalent

env:
  # Repository Variables - Settings > Secrets and variables > Actions > Variables
  BASELINE_VERSION: ${{ vars.BASELINE_VERSION }} # version of the B001 baseline migration
  JDBC_BUILD: ${{ vars.JDBC_BUILD }}
  JDBC_QA: ${{ vars.JDBC_QA }}
  JDBC_CHECK: ${{ vars.JDBC_CHECK }} # throwaway DB the check report builds against - wiped every run
  EMAIL: ${{ vars.USER_EMAIL }}

  # Repository Secrets - Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }}
  FIRST_UNDO_SCRIPT: ${{ secrets.FIRST_UNDO_SCRIPT }} # first version that has an undo script (undo -target is inclusive)
  DB_USER_BUILD: ${{ secrets.DB_USER_BUILD }}
  DB_USER_PW_BUILD: ${{ secrets.DB_USER_PW_BUILD }}
  DB_USER_QA: ${{ secrets.DB_USER_QA }}
  DB_USER_PW_QA: ${{ secrets.DB_USER_PW_QA }}
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}

  # Same as the Azure $(FLYWAY) variable: common arguments for every flyway call.
  FLYWAY: >-
    flyway -email="${{ vars.USER_EMAIL }}" -token="${{ secrets.FLYWAY_TOKEN }}"
    -locations="filesystem:${{ github.workspace }}\migrations"
    -configFiles="${{ github.workspace }}\flyway.toml"
    -baselineOnMigrate=true -baselineVersion=${{ vars.BASELINE_VERSION }}
    -errorOverrides=S0001:0:I-

  # Blank these out to use Windows integrated security instead (see setup/README.md)
  BUILD_LOGIN: -user="${{ secrets.DB_USER_BUILD }}" -password="${{ secrets.DB_USER_PW_BUILD }}"
  QA_LOGIN: -user="${{ secrets.DB_USER_QA }}" -password="${{ secrets.DB_USER_PW_QA }}"
  CHECK_LOGIN: -environments.check.user="${{ secrets.DB_USER_CHECK }}" -environments.check.password="${{ secrets.DB_USER_PW_CHECK }}"

jobs:
  # ---------------------------------------------------------------- stage: Build
  build:
    name: Build Database
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd # Azure 'script' steps run in cmd on Windows agents
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      # Installs and licenses the Flyway CLI on the runner (pinned for reproducible runs).
      # The Azure sample assumes flyway is already on the agent's PATH; this replaces that.
      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      # Reset the Build DB to empty, so every run replays the full migration history
      - name: Clean Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} info clean info -url="${{ env.JDBC_BUILD }}"
        env:
          FLYWAY_CLEAN_DISABLED: false

      # Fails if any versioned migration script is broken
      - name: Migrate Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} migrate info -url="${{ env.JDBC_BUILD }}"

      # Fails if any undo script is broken
      - name: Rollback Build DB
        run: ${{ env.FLYWAY }} ${{ env.BUILD_LOGIN }} undo info -url="${{ env.JDBC_BUILD }}" -target="${{ env.FIRST_UNDO_SCRIPT }}"

  # --------------------------------------------------------------- stage: Report
  # Only runs if the Build stage passed, so a report existing proves the scripts
  # migrate and roll back cleanly
  report:
    name: QA Check Report
    runs-on: self-hosted
    needs: build
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: QA Check Report
        run: >-
          ${{ env.FLYWAY }} ${{ env.QA_LOGIN }} ${{ env.CHECK_LOGIN }}
          check -code -changes -drift -dryrun -url="${{ env.JDBC_QA }}"
          -environments.check.url="${{ env.JDBC_CHECK }}"
          -environments.check.flyway.cleanDisabled=false
          -check.buildEnvironment="check"
          -reportFilename="${{ github.workspace }}\reports\QA-${{ github.run_id }}-Check-Report.html"
        env:
          FLYWAY_CLEAN_DISABLED: true
          FLYWAY_ENV_NATIVE_SQLFLUFF: true

      # Azure: PublishBuildArtifacts. Uploaded even if the check step fails - that is
      # when you most need to read it.
      - name: Publish QA Check Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qa-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn

  # ------------------------------------------------------------- next: deploy-qa.yml
  # Reusable-workflow call: deploy-qa.yml's jobs run inside THIS run, so Build, QA and
  # Production all show on one page. Equivalent of chaining the Azure pipelines.
  qa:
    name: QA
    needs: report
    uses: ./.github/workflows/deploy-qa.yml
    secrets: inherit

  # ----------------------------------------------------------- next: deploy-prod.yml
  prod:
    name: Production
    needs: qa
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
