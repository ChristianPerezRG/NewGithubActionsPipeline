# Report on Production, pause for approval, then deploy to Production.
# GitHub Actions port of Flyway-Sample-Pipelines/Azure/Simple-Workflow/deploy-prod.yml,
# without the second tenant (Prod2). Azure's ManualValidation stage is the 'production'
# GitHub Environment with a required reviewer: Deploy Prod waits until someone approves it.
#
# Called by deploy-build.yml (workflow_call) after the QA stages pass, so its jobs appear
# in the same run. Can also be queued on its own with 'Run workflow'.

name: Flyway Production Stages

on:
  workflow_call:
  workflow_dispatch:

env:
  # Repository Variables
  BASELINE_VERSION: ${{ vars.BASELINE_VERSION }}
  JDBC_PROD1: ${{ vars.JDBC_PROD1 }} # Azure 'prod_database_JDBC'
  JDBC_CHECK: ${{ vars.JDBC_CHECK }}
  EMAIL: ${{ vars.USER_EMAIL }}

  # Repository Secrets (passed through by the caller with 'secrets: inherit')
  TOKEN: ${{ secrets.FLYWAY_TOKEN }}
  DB_USER_PROD1: ${{ secrets.DB_USER_PROD1 }}
  DB_USER_PW_PROD1: ${{ secrets.DB_USER_PW_PROD1 }}
  DB_USER_CHECK: ${{ secrets.DB_USER_CHECK }}
  DB_USER_PW_CHECK: ${{ secrets.DB_USER_PW_CHECK }}

  FLYWAY: >-
    flyway -email="${{ vars.USER_EMAIL }}" -token="${{ secrets.FLYWAY_TOKEN }}"
    -locations="filesystem:${{ github.workspace }}\migrations"
    -configFiles="${{ github.workspace }}\flyway.toml"
    -baselineOnMigrate=true -baselineVersion=${{ vars.BASELINE_VERSION }}
    -errorOverrides=S0001:0:I-

  # Blank these out to use Windows integrated security instead (see setup/README.md)
  PROD_LOGIN: -user="${{ secrets.DB_USER_PROD1 }}" -password="${{ secrets.DB_USER_PW_PROD1 }}"
  CHECK_LOGIN: -environments.check.user="${{ secrets.DB_USER_CHECK }}" -environments.check.password="${{ secrets.DB_USER_PW_CHECK }}"

jobs:
  # --------------------------------------------------------------- stage: Report
  # Fresh report at deploy time, so the approver sees the current state of Production
  report:
    name: Production Check Report
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Production Check Report
        run: >-
          ${{ env.FLYWAY }} ${{ env.PROD_LOGIN }} ${{ env.CHECK_LOGIN }}
          check -code -changes -drift -dryrun -url="${{ env.JDBC_PROD1 }}"
          -environments.check.url="${{ env.JDBC_CHECK }}"
          -environments.check.flyway.cleanDisabled=false
          -check.buildEnvironment="check"
          -reportFilename="${{ github.workspace }}\reports\Prod-${{ github.run_id }}-Check-Report.html"
        env:
          FLYWAY_CLEAN_DISABLED: true
          FLYWAY_ENV_NATIVE_SQLFLUFF: true

      - name: Publish Production Check Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: prod-check-report
          path: ${{ github.workspace }}/reports/
          if-no-files-found: warn

  # ----------------------------------------------- stage: Approval + DeployProd
  # 'environment: production' holds this job until a required reviewer approves it
  # (Settings > Environments > production). Review the prod-check-report artifact
  # from the report job, then approve. Azure equivalent: ManualValidation@0.
  deploy-prod:
    name: Deploy Prod
    runs-on: self-hosted
    needs: report
    environment: production
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0"
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      - name: Deploy Prod
        run: ${{ env.FLYWAY }} ${{ env.PROD_LOGIN }} info migrate info -url="${{ env.JDBC_PROD1 }}"
        env:
          FLYWAY_CLEAN_DISABLED: true
